<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oder24hz</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Montserrat',sans-serif;
background:black;
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
width:100%;
padding:15px 25px;
display:flex;
justify-content:space-between;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-weight:900;
font-size:18px;
}

.nav-links a{
margin-left:25px;
text-decoration:none;
color:white;
font-weight:800;
opacity:0.85;
transition:.3s;
}

.nav-links a:hover{
opacity:1;
text-shadow:0 0 12px rgba(255,255,255,0.8);
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
transition:.6s;
}

.hero.hide{
opacity:0;
transform:translateY(-50px);
}

/* ПУЛЬСАЦИЯ */
.title{
font-size:80px;
font-weight:900;
animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%{text-shadow:0 0 10px rgba(255,255,255,0.3);}
50%{text-shadow:0 0 40px rgba(255,255,255,0.9);}
100%{text-shadow:0 0 10px rgba(255,255,255,0.3);}
}

.hero p{
font-size:22px;
opacity:0.9;
}

/* BUTTON */
.button{
margin-top:30px;
padding:16px 60px;
border-radius:12px;
border:none;
background:white;
color:black;
cursor:pointer;
font-weight:900;
transition:.3s;
box-shadow:0 0 25px rgba(255,255,255,0.5);
}

.button:hover{
transform:scale(1.05);
box-shadow:0 0 45px rgba(255,255,255,0.9);
}

/* SERVICES */
#services{
opacity:0;
pointer-events:none;
transition:.6s;
padding:120px 20px;
}

#services.show{
opacity:1;
pointer-events:auto;
}

.services-container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px;
max-width:1000px;
margin:auto;
}

.service{
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.15);
transition:.3s;
}

.service:hover{
transform:translateY(-5px);
box-shadow:0 0 25px rgba(255,255,255,0.15);
}

.service-title{
display:flex;
justify-content:space-between;
cursor:pointer;
font-weight:700;
}

.price{
font-size:38px;
font-weight:900;
margin:15px 0;
}

.desc{
display:none;
margin-top:10px;
opacity:0.8;
}

.desc.show{
display:block;
}

/* BUY */
.buy{
margin-top:10px;
width:100%;
padding:14px;
border-radius:10px;
background:white;
color:black;
border:none;
cursor:pointer;
font-weight:900;
box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.buy-global{
margin-top:50px;
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.buy-global button{
padding:16px 35px;
border-radius:12px;
border:none;
background:white;
color:black;
font-weight:900;
cursor:pointer;
box-shadow:0 0 25px rgba(255,255,255,0.5);
}

/* MODAL */
.modal{
display:flex;
opacity:0;
pointer-events:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.7);
transition:.3s;
}

.modal.show{
opacity:1;
pointer-events:auto;
}

.modal-content{
background:#111;
padding:25px;
border-radius:15px;
width:90%;
max-width:400px;
}

.close{
position:absolute;
top:15px;
right:20px;
cursor:pointer;
}

/* CANVAS */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">@OderOptimization</div>
<div class="nav-links">
<a href="https://t.me/Oderrrr">Telegram</a>
<a href="https://t.me/OderOptimization">Support</a>
</div>
</div>

<div class="hero" id="hero">
<h1 class="title">Oder24hz</h1>
<p><b>Optimization changes the rules of the game.</b></p>
<button class="button" onclick="openServices()">Store</button>
</div>

<canvas id="particles"></canvas>

<div id="services">
<div class="services-container">

<div class="service">
<div class="service-title" onclick="toggle(this)">Optimization Windows</div>
<div class="price">200₽ | 120₴</div>
<div class="desc">Оптимизация Windows, повышение FPS и стабильности.</div>
<button class="buy" onclick="openModal('rub')">Купить</button>
</div>

<div class="service">
<div class="service-title" onclick="toggle(this)">Bluestacks</div>
<div class="price">400₽ | 240₴</div>
<div class="desc">Настройка эмулятора и повышение FPS.</div>
<button class="buy" onclick="openModal('rub')">Купить</button>
</div>

</div>

<div class="buy-global">
<button onclick="openModal('rub')">Купить за рубли</button>
<button onclick="openModal('uah')">Купить за гривны</button>
<button onclick="location.href='https://t.me/OderOptimization'">Купить переводом</button>
</div>
</div>

<script>
function openServices(){
document.getElementById("hero").classList.add("hide");
setTimeout(()=>{
document.getElementById("hero").style.display="none";
document.getElementById("services").classList.add("show");
},400);
}

function toggle(el){
let d=el.parentElement.querySelector(".desc");
d.classList.toggle("show");
}

function openModal(type){
if(type==="rub") window.open("https://www.donationalerts.com/r/oder24hz");
if(type==="uah") window.open("https://new.donatepay.ru/@1292052");
}

/* НОРМАЛЬНЫЕ ЧАСТИЦЫ */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<50;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
dx:(Math.random()-0.5)*0.3,
dy:(Math.random()-0.5)*0.3
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;

ctx.fillStyle="white";
ctx.fillRect(p.x,p.y,2,2);
});

requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
