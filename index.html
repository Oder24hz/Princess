<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oder24hz</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Montserrat',sans-serif;
background:black;
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
width:100%;
padding:15px 25px;
display:flex;
justify-content:space-between;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:1000;
}

/* ЛОГО */
.logo{
font-weight:900;
font-size:18px;
letter-spacing:1px;
}

/* LINKS */
.nav-links a{
margin-left:25px;
text-decoration:none;
color:white;
font-weight:800;
opacity:0.85;
transition:.3s;
}

.nav-links a:hover{
opacity:1;
text-shadow:0 0 12px rgba(255,255,255,0.9);
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
transition:.6s;
}

.hero.hide{
opacity:0;
transform:translateY(-50px);
}

/* ГРАДИЕНТ ТЕКСТ */
.gradient-text{
font-size:80px;
font-weight:900;
background:linear-gradient(90deg,#ffffff,#bbbbbb,#ffffff);
background-size:200%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:gradientMove 4s linear infinite;
text-shadow:0 0 20px rgba(255,255,255,0.4);
}

@keyframes gradientMove{
0%{background-position:0%}
100%{background-position:200%}
}

.hero p{
font-size:22px;
opacity:0.9;
text-shadow:0 0 10px rgba(255,255,255,0.2);
}

/* КНОПКИ */
.button{
margin-top:30px;
padding:16px 60px;
border-radius:12px;
border:none;
background:white;
color:black;
cursor:pointer;
font-weight:900;
font-size:16px;
transition:.3s;
box-shadow:0 0 25px rgba(255,255,255,0.5);
}

.button:hover{
transform:scale(1.05);
box-shadow:0 0 45px rgba(255,255,255,0.9);
}

/* SERVICES */
#services{
opacity:0;
pointer-events:none;
transition:.6s;
padding:120px 20px;
}

#services.show{
opacity:1;
pointer-events:auto;
}

.services-container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px;
max-width:1000px;
margin:auto;
}

.service{
position:relative;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.15);
transition:.3s;
}

.service:hover{
transform:translateY(-5px);
box-shadow:0 0 25px rgba(255,255,255,0.15);
}

.service-title{
display:flex;
justify-content:space-between;
cursor:pointer;
font-weight:700;
}

.price{
font-size:38px;
font-weight:900;
margin:15px 0;
}

/* ОПИСАНИЕ */
.desc{
position:absolute;
left:0;
top:100%;
width:100%;
background:#111;
padding:15px;
border-radius:15px;
opacity:0;
pointer-events:none;
transform:translateY(-10px);
transition:.3s;
z-index:5;
}

.desc.show{
opacity:1;
pointer-events:auto;
transform:translateY(10px);
}

/* BUY */
.buy{
margin-top:10px;
width:100%;
padding:14px;
border-radius:10px;
background:white;
color:black;
border:none;
cursor:pointer;
font-weight:900;
transition:.3s;
box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.buy:hover{
transform:scale(1.05);
box-shadow:0 0 40px rgba(255,255,255,0.9);
}

/* GLOBAL BUY */
.buy-global{
margin-top:50px;
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.buy-global button{
padding:16px 35px;
border-radius:12px;
border:none;
background:white;
color:black;
font-weight:900;
cursor:pointer;
transition:.3s;
box-shadow:0 0 25px rgba(255,255,255,0.5);
}

.buy-global button:hover{
transform:scale(1.08);
box-shadow:0 0 45px rgba(255,255,255,0.9);
}

/* MODAL */
.modal{
display:flex;
opacity:0;
pointer-events:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(8px);
transition:.3s;
}

.modal.show{
opacity:1;
pointer-events:auto;
}

.modal-content{
background:#111;
padding:25px;
border-radius:15px;
width:90%;
max-width:400px;
transform:scale(.8);
transition:.3s;
}

.modal.show .modal-content{
transform:scale(1);
}

.close{
position:absolute;
top:15px;
right:20px;
cursor:pointer;
}

/* CANVAS */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

@media(max-width:768px){
.services-container{grid-template-columns:1fr}
.gradient-text{font-size:45px}
}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">@OderOptimization</div>
<div class="nav-links">
<a href="https://t.me/Oderrrr">Telegram</a>
<a href="https://t.me/OderOptimization">Support</a>
</div>
</div>

<div class="hero" id="hero">
<h1 class="gradient-text">Oder24hz</h1>
<p><b>Optimization changes the rules of the game.</b></p>
<button class="button" onclick="openServices()">Store</button>
</div>

<canvas id="particles"></canvas>

<script>
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<60;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
dx:(Math.random()-0.5)*0.5,
dy:(Math.random()-0.5)*0.5
});
}

function drawCube(x,y,size){
ctx.strokeStyle="rgba(255,255,255,0.6)";
ctx.strokeRect(x,y,size,size);
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach((p,i)=>{
p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;

drawCube(p.x,p.y,6);

particles.forEach(p2=>{
let dist=Math.hypot(p.x-p2.x,p.y-p2.y);
if(dist<120){
ctx.beginPath();
ctx.moveTo(p.x,p.y);
ctx.lineTo(p2.x,p2.y);
ctx.strokeStyle="rgba(255,255,255,0.1)";
ctx.stroke();
}
});
});

requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
