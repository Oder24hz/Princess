<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 февраля 💖</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #FFC0CB, #FF69B4);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  #container {
    text-align: center;
    width: 100%;
    max-width: 600px;
  }
  .level { display: none; }
  .level.active { display: block; animation: fadeIn 0.8s ease; }
  h1 {
    color: #fff;
    margin-bottom: 20px;
    text-shadow: 2px 2px #FF1493;
  }
  .clickable-heart, .moving-heart {
    width: 100px;
    height: 100px;
    background: red;
    clip-path: polygon(50% 0%,61% 12%,75% 12%,88% 25%,88% 38%,75% 50%,50% 80%,25% 50%,12% 38%,12% 25%,25% 12%,39% 12%);
    margin: 0 auto;
    cursor: pointer;
    transition: transform 0.2s;
    position: relative;
  }
  .clickable-heart:hover, .moving-heart:hover { transform: scale(1.2); }
  .gift-btn {
    display: inline-block;
    padding: 15px 25px;
    margin: 10px;
    background: #fff;
    border-radius: 15px;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
  }
  .gift-btn:hover { transform: scale(1.1); background: #FFB6C1; color: #fff; }
  #floatingHearts div {
    position: absolute;
    width: 40px;
    height: 40px;
    background: red;
    clip-path: polygon(50% 0%,61% 12%,75% 12%,88% 25%,88% 38%,75% 50%,50% 80%,25% 50%,12% 38%,12% 25%,25% 12%,39% 12%);
    animation: float linear infinite;
  }
  #finalBtn {
    padding: 20px 40px;
    font-size: 20px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #FF1493;
    color: #fff;
    transition: transform 0.3s;
  }
  #finalBtn:hover { transform: scale(1.2); }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  @keyframes float { 0%{transform:translateY(100vh) scale(0.8);} 50%{transform:translateY(50vh) scale(1);} 100%{transform:translateY(0) scale(0.8);} }
</style>
</head>
<body>
<div id="container">
  <!-- Уровни -->
  <div class="level" id="level1">
    <h1>💖 Нажми на сердце, чтобы начать!</h1>
    <div class="clickable-heart" id="startHeart"></div>
  </div>

  <div class="level" id="level2">
    <h1>Выбери подарок 🎁</h1>
    <div class="gift-btn" data-correct="false">🎀 Шарик</div>
    <div class="gift-btn" data-correct="true">❤️ Сердце</div>
    <div class="gift-btn" data-correct="false">🍫 Шоколадка</div>
  </div>

  <div class="level" id="level3">
    <h1>Поймай бегущее сердце!</h1>
    <div class="moving-heart" id="movingHeart"></div>
  </div>

  <div class="level" id="level4">
    <h1>Кликайте на сердца!</h1>
    <div id="floatingHearts"></div>
  </div>

  <div class="level" id="level5">
    <h1>Выбери шоколадку 🍫</h1>
    <div class="gift-btn" data-correct="false">Молочная</div>
    <div class="gift-btn" data-correct="true">С сердечком</div>
    <div class="gift-btn" data-correct="false">Белая</div>
  </div>

  <div class="level" id="level6">
    <h1>🎉 Ты прошла все уровни! ❤️</h1>
    <button id="finalBtn">Обними меня</button>
  </div>
</div>

<script>
let currentLevel = 1;
showLevel(currentLevel);

// Уровень 1: старт
document.getElementById("startHeart").addEventListener("click", nextLevel);

// Уровни 2 и 5: выбор подарка
document.querySelectorAll(".gift-btn").forEach(btn => {
  btn.addEventListener("click", e => {
    const correct = e.target.dataset.correct === "true";
    if(correct) nextLevel();
    else alert("Ой, не тот подарок 😜");
  });
});

// Уровень 3: догоняй сердце
const movingHeart = document.getElementById("movingHeart");
movingHeart.addEventListener("click", nextLevel);
setInterval(() => {
  movingHeart.style.top = Math.random()*70 + "vh";
  movingHeart.style.left = Math.random()*70 + "vw";
}, 1000);

// Уровень 4: мелькающие сердца
const floatingHearts = document.getElementById("floatingHearts");
let heartsClicked = 0;
for(let i=0;i<10;i++){
  let heart = document.createElement("div");
  heart.style.left = Math.random()*90 + "vw";
  heart.style.top = Math.random()*90 + "vh";
  heart.style.animationDuration = (2+Math.random()*3)+"s";
  heart.addEventListener("click", () => {
    heart.style.display="none";
    heartsClicked++;
    if(heartsClicked===10) nextLevel();
  });
  floatingHearts.appendChild(heart);
}

// Финальный уровень
document.getElementById("finalBtn").addEventListener("click", () => {
  alert("❤️ Люблю тебя! ❤️");
});

function showLevel(n){
  document.querySelectorAll(".level").forEach(l=>l.classList.remove("active"));
  document.getElementById("level"+n).classList.add("active");
}

function nextLevel(){
  currentLevel++;
  if(currentLevel>6) currentLevel=6;
  showLevel(currentLevel);
}

// Стартовый уровень сразу показываем
showLevel(currentLevel);
</script>
</body>
</html>
