<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princess Love Quest 💗</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Segoe UI',sans-serif;
  height:100vh;
  background:linear-gradient(135deg,#ffd6ec,#ffc2e2,#ffe6f4);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

/* Сакура */
.petal{
  position:fixed;
  top:-10px;
  width:12px;height:12px;
  background:radial-gradient(circle,#ff8ecf,#ffb6e6);
  border-radius:50% 50% 50% 0;
  transform:rotate(45deg);
  opacity:.8;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);opacity:.2;}
}

/* Карточка */
.card{
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.15);
  padding:40px;
  border-radius:25px;
  box-shadow:0 0 50px rgba(255,255,255,0.5);
  width:90%;max-width:520px;
  text-align:center;
  opacity:0;
  transform:scale(.95);
  transition:all .6s ease;
  position:relative;
}
.card.active{
  opacity:1;
  transform:scale(1);
}

button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  margin:10px;
  cursor:pointer;
  transition:.3s;
}
.primary{background:#ff4fa3;color:white;}
.secondary{
  background:white;
  color:#ff4fa3;
  position:absolute;
}

input{
  padding:10px;
  border-radius:15px;
  border:none;
  text-align:center;
}

.progress{
  width:100%;height:12px;
  background:rgba(255,255,255,.3);
  border-radius:20px;
  margin-top:20px;
  overflow:hidden;
}
.bar{
  height:100%;width:0%;
  background:white;
  transition:.3s;
}

img{
  width:260px;
  border-radius:20px;
  margin-top:15px;
  box-shadow:0 0 25px rgba(255,255,255,.6);
}
</style>
</head>
<body>

<div id="app"></div>

<script>

/* САКУРА */
function createPetal(){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(createPetal,300);

/* УРОВНИ */
const levels=[

`<div class="card active">
<h2>👑 Проверка памяти</h2>
<p>Когда началась лучшая история?</p>
<input id="dateInput" placeholder="Введите дату">
<br><br>
<button class="primary" onclick="checkDate()">Проверить</button>
</div>`,

`<div class="card">
<h2>💅 Тест на капризность</h2>
<p>Ты иногда вредничаешь?</p>
<button class="primary" onclick="nextLevel()">Я принцесса, мне можно</button>
<button onclick="alert('Не обманывай систему 😌')">Нет</button>
</div>`,

`<div class="card">
<h2>💗 Ты меня любишь?</h2>
<button id="yesBtn" class="secondary">Да ❤️</button>
<button class="primary" onclick="noClicked()">Нет 😌</button>
</div>`,

`<div class="card">
<h2>🎮 Докажи</h2>
<p id="clickCount">0 / 40</p>
</div>`,

`<div class="card">
<h2>⏳ Проверка терпения...</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>`,

`<div class="card">
<h2>📜 Контракт №21082025</h2>
<p>Подтверждаешь что ты самая лучшая?</p>
<button class="primary" onclick="nextLevel()">Подписать 👑</button>
</div>`,

`<div class="card">
<h2>🌸 Ты прошла всё</h2>
<p>С 21 августа 2025<br>и до бесконечности 💗</p>
<img src="photo2.jpg">
<br><br>
<h2>Я тебя люблю ❤️</h2>
<br>
<button class="primary" onclick="nextLevel()">Секрет 😈</button>
</div>`,

`<div class="card">
<h2>КОГДА ПЫТАЕШЬСЯ ЧТО-ТО ДОКАЗАТЬ 😂</h2>
<img src="photo3.jpg">
<p>Я так и знал 😌</p>
</div>`
];

let current=0;
const app=document.getElementById("app");
app.innerHTML=levels[current];

/* Переход */
function nextLevel(){
  const card=document.querySelector(".card");
  card.classList.remove("active");
  setTimeout(()=>{
    current++;
    app.innerHTML=levels[current];
    setTimeout(()=>{
      document.querySelector(".card").classList.add("active");
      if(current===2) setupYesRun();
      if(current===3) setupClicks();
      if(current===4) fakeLoading();
    },50);
  },500);
}

/* Проверка даты */
function checkDate(){
  const val=document.getElementById("dateInput").value.trim();
  if(val==="21 августа 2025" || (val.includes("21") && val.includes("2025"))){
    nextLevel();
  }else{
    alert("Подумай лучше 😏 Это 21 августа 2025");
  }
}

/* Убегающая ДА */
function setupYesRun(){
  const yes=document.getElementById("yesBtn");
  yes.style.top="60%";
  yes.style.left="20%";
  yes.addEventListener("mouseover",()=>{
    yes.style.top=Math.random()*70+"%";
    yes.style.left=Math.random()*70+"%";
  });
}

/* НЕТ → сообщение и переход */
function noClicked(){
  alert("Я так и знал 😌");
  nextLevel();
}

/* Клики */
function setupClicks(){
  let clicks=0;
  document.querySelector(".card").addEventListener("click",()=>{
    clicks++;
    document.getElementById("clickCount").innerText=clicks+" / 40";
    if(clicks>=40) nextLevel();
  });
}

/* Загрузка */
function fakeLoading(){
  let width=0;
  const bar=document.getElementById("bar");
  const interval=setInterval(()=>{
    width+=4;
    bar.style.width=width+"%";
    if(width>=100){
      clearInterval(interval);
      nextLevel();
    }
  },150);
}

</script>
</body>
</html>
