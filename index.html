<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princess Love Quest 💗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Segoe UI',sans-serif;
  height:100vh;
  background:linear-gradient(135deg,#ffd6ec,#ffc2e2,#ffe6f4);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

.card{
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.15);
  padding:40px;
  border-radius:25px;
  box-shadow:0 0 50px rgba(255,255,255,.5);
  width:90%;max-width:520px;
  text-align:center;
  opacity:0;
  transform:scale(.95);
  transition:all .6s ease;
  position:relative;
}
.card.active{opacity:1; transform:scale(1);}

button{padding:12px 25px;border:none;border-radius:30px;margin:10px;cursor:pointer;transition:.3s;}
.primary{background:#ff4fa3;color:white;}
.secondary{background:white;color:#ff4fa3;position:absolute;}
input{padding:10px;border-radius:15px;border:none;text-align:center;}

.progress{width:100%;height:12px;background:rgba(255,255,255,.3);border-radius:20px;margin-top:20px;overflow:hidden;}
.bar{height:100%;width:0%;background:white;transition:.3s;}

img{width:260px;border-radius:20px;margin-top:15px;box-shadow:0 0 25px rgba(255,255,255,.6);cursor:pointer;}

#puzzle{width:244px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);grid-gap:2px;}
.piece{width:120px;height:120px;background-size:240px 240px;border-radius:10px;border:1px solid #fff;cursor:pointer;}
#timer{font-size:20px;margin-top:15px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const levels=[
`<div class="card active">
<h2>👑 Проверка памяти</h2>
<p>Когда началась лучшая история?</p>
<input id="dateInput" placeholder="Введите дату">
<br><br>
<button class="primary" onclick="checkDate()">Проверить</button>
</div>`,

`<div class="card">
<h2>💅 Тест на капризность</h2>
<p>Ты иногда вредничаешь?</p>
<button class="primary" onclick="nextLevelMessage('ещё попробуй поспорить')">Я принцесса, мне можно</button>
<button onclick="alert('Не обманывай систему 😌')">Нет</button>
</div>`,

`<div class="card">
<h2>💗 Ты меня любишь?</h2>
<button id="yesBtn" class="secondary">Да ❤️</button>
<button class="primary" onclick="noClicked()">Нет 😌</button>
</div>`,

`<div class="card">
<h2>🎮 Докажи что любишь меня</h2>
<p id="clickCount">0 / 50</p>
<button class="primary" id="clickBtn">Кликни меня ❤️</button>
</div>`,

`<div class="card">
<h2>⏳ Проверка терпения...</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>`,

`<div class="card">
<h2>📜 Контракт №21082025</h2>
<p>Подтверждаешь что ты самая лучшая?</p>
<button class="primary" onclick="nextLevel()">Подписать 👑</button>
</div>`,

`<div class="card">
<h2>🤔 Загадка Standoff</h2>
<p>Кто самый лучший игрок Standoff?</p>
<div id="timer"></div>
<button onclick="standoffAnswer('Ты')">Ты</button>
<button onclick="standoffAnswer('Одер')">Одер</button>
</div>`,

`<div class="card">
<h2>🧩 Фото-пазл</h2>
<p>Собери пазл!</p>
<div id="puzzle"></div>
</div>`,

`<div class="card">
<h2>🍌 Любимый фрукт</h2>
<p>Выбери правильный фрукт</p>
<button onclick="fruitAnswer('Банан')">Банан</button>
<button onclick="fruitAnswer('Яблоко')">Яблоко</button>
<button onclick="fruitAnswer('Апельсин')">Апельсин</button>
</div>`,

`<div class="card">
<h2>🎲 Угадай цифру 1-5</h2>
<p>Попробуй угадать</p>
<div id="timer"></div>
<button onclick="guessNumber(1)">1</button>
<button onclick="guessNumber(2)">2</button>
<button onclick="guessNumber(3)">3</button>
<button onclick="guessNumber(4)">4</button>
<button onclick="guessNumber(5)">5</button>
</div>`,

`<div class="card">
<h2>🐱 Выбери кота</h2>
<p>Кто милее всех?</p>
<button onclick="chooseCat('сердечки')">Кот с сердечками</button>
<button onclick="chooseCat('шляпа')">Кот в шляпе</button>
<button onclick="chooseCat('очки')">Кот в очках</button>
</div>`,

`<div class="card">
<h2>🌸 Ты прошла всё</h2>
<p>С 21 августа 2025 и до бесконечности 💗</p>
<img src="photo2.jpg">
<br><br>
<h2>Я тебя люблю ❤️</h2>
<img src="photo3.jpg">
</div>`
];

let current=0;
const app=document.getElementById("app");
app.innerHTML=levels[current];

function nextLevel(){
  const card=document.querySelector(".card");
  if(card) card.classList.remove("active");
  setTimeout(()=>{
    current++; if(current>=levels.length) current=levels.length-1;
    app.innerHTML=levels[current];
    setTimeout(()=>{
      document.querySelector(".card").classList.add("active");
      if(current===2) setupYesRun();
      if(current===3) setupClicks(); // клики
      if(current===4) fakeLoading();
      if(current===7) setupPuzzle();
      if(current===6 || current===9) startTimer(15); // таймер 15 секунд на Standoff и угадай цифру
    },50);
  },300);
}

function nextLevelMessage(msg){alert(msg); nextLevel();}
function checkDate(){ const val=document.getElementById("dateInput").value.trim(); if(val==="21 августа 2025" || (val.includes("21") && val.includes("2025"))) nextLevel(); else alert("Подумай лучше 😏 Это 21 августа 2025"); }
function setupYesRun(){ const yes=document.getElementById("yesBtn"); yes.style.top="60%"; yes.style.left="20%"; yes.addEventListener("mouseover",()=>{ yes.style.top=Math.random()*70+"%"; yes.style.left=Math.random()*70+"%"; }); }
function noClicked(){alert("Я так и знал 😌"); nextLevel();}

/* Исправленные клики */
function setupClicks(){
  let clicks=0, maxClicks=50;
  const counter=document.getElementById("clickCount");
  const btn=document.getElementById("clickBtn");
  btn.addEventListener("click",()=>{
    clicks++;
    if(clicks>50 && maxClicks===50){ maxClicks=150; alert("Я тебе не верю, ещё тыкай"); }
    counter.innerText=clicks+" / "+maxClicks;
    if(clicks>=maxClicks) nextLevel();
  });
}

/* Загрузка */
function fakeLoading(){
  let width=0;
  const bar=document.getElementById("bar");
  const interval=setInterval(()=>{ width+=4; bar.style.width=width+"%"; if(width>=100){ clearInterval(interval); nextLevel(); } },150);
}

/* Загадки */
function standoffAnswer(ans){ if(ans==="Одер"){alert("извинись, ой, извините точнее"); nextLevel();} else alert("Неверно 😏 Попробуй снова"); }
function fruitAnswer(ans){ if(ans==="Банан"){alert("Верно! 🍌"); nextLevel();} else alert("Нет 😏 Попробуй ещё"); }
function guessNumber(num){ const n=Math.floor(Math.random()*5)+1; if(num===n){alert("Угадала! 🎉"); nextLevel();} else alert("Не угадала, выпал "+n); }
function chooseCat(c){ if(c==="сердечки"){alert("Правильно! 😻"); nextLevel();} else alert("Неверно 😼"); }

/* Пазл drag&drop */
function setupPuzzle(){
  const puzzle=document.getElementById("puzzle"); puzzle.innerHTML="";
  const size=2; let solved=0;
  const positions=[[0,0],[0,120],[120,0],[120,120]].sort(()=>Math.random()-0.5);
  positions.forEach((pos,index)=>{
    const piece=document.createElement("div");
    piece.className="piece";
    piece.style.backgroundImage="url('photo3.jpg')";
    piece.style.backgroundPosition=`-${pos[0]}px -${pos[1]}px`;
    piece.draggable=true;
    piece.dataset.pos=index;
    piece.addEventListener("dragstart",e=>e.dataTransfer.setData("text",index));
    puzzle.appendChild(piece);
  });
  puzzle.addEventListener("dragover",e=>e.preventDefault());
  puzzle.addEventListener("drop",e=>{
    const fromIndex=e.dataTransfer.getData("text");
    const toPiece=e.target;
    if(!toPiece.classList.contains("piece")) return;
    const fromPiece=puzzle.querySelector(`.piece[data-pos='${fromIndex}']`);
    const temp=fromPiece.style.backgroundPosition;
    fromPiece.style.backgroundPosition=toPiece.style.backgroundPosition;
    toPiece.style.backgroundPosition=temp;
    solved++;
    if(solved>=10){ alert("Пазл собран! Ты супер 😘"); nextLevel(); }
  });
}

/* Таймер для уровней */
function startTimer(seconds){
  const timerDiv=document.getElementById("timer");
  let time=seconds;
  timerDiv.innerText="Время: "+time+" сек";
  const interval=setInterval(()=>{
    time--;
    timerDiv.innerText="Время: "+time+" сек";
    if(time<=0){
      clearInterval(interval);
      alert("Время вышло 😏");
      nextLevel();
    }
  },1000);
}
</script>
</body>
</html>
